name: Update readme

on:
  workflow_dispatch:
  schedule:
    - cron: "25 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    # ubuntu-latest is moving to Ubuntu 26.04 through 19 Nov 2026. Pin the image
    # so the job does not flip back and forth during the rollout.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # System Python on this image is 3.14 and externally managed, so pip
      # install fails. github-readme-terminal also pins Pillow <11, which has
      # no wheels for 3.13+. 3.12 is the newest interpreter that package can use.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run script
        run: python main.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GIFOS_GENERAL_COLOR_SCHEME: "yoru"

      - name: Update readme
        run: |
          git add README.md
          git -c "user.name=github-actions[bot]" -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" commit -m "Automatically updated on $(TZ='Asia/Kolkata' date)"
          git push
